<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Fundo clássico: céu e areia */
    --ceu1: #dff1fb;
    --ceu2: #e9f7ec;
    --areia: #f3e3cc;
    
    /* Verde oficial extraído do Canva */
    --verde-canva: #b4f61f;
    --verde-canva-esc: #8acb0b;
    --verde-floresta: #012d11;
    --verde-profundo: #02200e;
    
    --verde-card: rgba(6, 32, 16, 0.88);
    --verde-borda: rgba(180, 246, 31, 0.25);
    --texto-claro: #f4fbf5;
    
    --top1-bg: linear-gradient(135deg, #b4f61f 0%, #a2de07 100%);
    --top1-texto: #02200e;
    
    --top2-bg: rgba(14, 46, 26, 0.92);
    --top2-borda: rgba(220, 245, 230, 0.4);
    --top2-pos: #d8eee2;
    
    --top3-bg: rgba(14, 46, 26, 0.92);
    --top3-borda: rgba(229, 162, 96, 0.4);
    --top3-pos: #e5a260;
  }
  * { box-sizing: border-box; margin: 0; }
    /* Fundo clássico: céu com gradiente e areia */
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Poppins', -apple-system, sans-serif;
    color: var(--texto-claro);
    background: linear-gradient(160deg, var(--ceu1) 0%, var(--ceu2) 55%, var(--areia) 100%);
    display: flex; flex-direction: column; padding: 2.8vh 4vw 3.8vh;
  }

  /* Morrinhos e nuvens de fundo (exatamente como antes, com z-index: -1) */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%; pointer-events: none;
  }
  body::before { width: 80vw; height: 40vh; left: -15vw; bottom: -24vh; background: var(--verde-canva); }
  body::after  { width: 70vw; height: 36vh; right: -18vw; bottom: -22vh; background: var(--verde-canva-esc); }
  .nuvem { position: fixed; z-index: -1; font-size: 9vh; opacity: .55; animation: vagar 60s linear infinite; pointer-events: none; }
  @keyframes vagar { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }

  header {
    text-align: center;
    margin-bottom: 2.6vh;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .evento-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 1.2vw;
  }
  .badge-tag {
    flex: none;
    width: 6.2vh;
    height: 6.2vh;
    border-radius: 50%;
    background: var(--verde-canva);
    color: var(--verde-profundo);
    font-family: 'Syne', sans-serif;
    font-size: 3.4vh;
    font-weight: 800;
    display: grid;
    place-items: center;
    box-shadow: 0 0.6vh 1.6vh rgba(0, 0, 0, 0.2);
    transform: rotate(-7deg);
    user-select: none;
  }
  .evento {
    display: inline-block;
    padding: 0.7vh 4.5vw;
    border-radius: 99px;
    background: var(--verde-profundo);
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 5.6vh;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 0.35vh solid var(--verde-canva);
    box-shadow: 0 0.8vh 2.5vh rgba(0, 0, 0, 0.25), inset 0 0 1.5vh rgba(180, 246, 31, 0.2);
  }

  #grade {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.1vh;
    width: min(100%, 128vh);
    margin: 0 auto;
    z-index: 1;
  }
  .card {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    gap: 1.6vw;
    padding: 0 2vw;
    border-radius: 2vh;
    background: var(--verde-card);
    border: 1px solid var(--verde-borda);
    box-shadow: 0 0.6vh 1.8vh rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(10px);
    will-change: transform;
    transition: border-color 0.3s;
  }
  .pos {
    flex: none;
    width: 5.2vh;
    height: 5.2vh;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: 'Syne', sans-serif;
    font-size: 2.8vh;
    font-weight: 800;
    color: var(--verde-canva);
    background: rgba(180, 246, 31, 0.15);
    border: 1px solid rgba(180, 246, 31, 0.3);
  }

  /* TOP 1 - O Líder destacado com verde do Canva */
  .p1 {
    background: var(--top1-bg);
    border-color: #d8ff66;
    box-shadow: 0 0.8vh 2.6vh rgba(180, 246, 31, 0.4), 0 0 1vh rgba(180, 246, 31, 0.2);
  }
  .p1 .pos {
    background: var(--verde-profundo);
    color: var(--verde-canva);
    border-color: var(--verde-profundo);
    box-shadow: 0 0.3vh 0.8vh rgba(0, 0, 0, 0.3);
  }
  .p1 .nome {
    color: var(--top1-texto);
    font-weight: 700;
  }

  /* TOP 2 */
  .p2 {
    background: var(--top2-bg);
    border-color: var(--top2-borda);
  }
  .p2 .pos {
    background: var(--top2-pos);
    color: #082a14;
    border-color: var(--top2-pos);
  }

  /* TOP 3 */
  .p3 {
    background: var(--top3-bg);
    border-color: var(--top3-borda);
  }
  .p3 .pos {
    background: var(--top3-pos);
    color: #2b1404;
    border-color: var(--top3-pos);
  }

  .avatar {
    flex: none;
    width: 6.2vh;
    height: 6.2vh;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.25) 0%, var(--bg) 80%);
    border: 0.3vh solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0.3vh 0.8vh rgba(0, 0, 0, 0.3);
  }
  .p1 .avatar {
    border-color: var(--verde-profundo);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .corpo { fill: var(--c); }
  .cabeca { fill: var(--c2); stroke: var(--c); stroke-width: 1.4; }
  .olho { fill: #0b1a0f; }
  .boca { fill: none; stroke: #0b1a0f; stroke-width: 1.6; stroke-linecap: round; }
  .coroa { display: none; stroke: #fff; stroke-width: .8; stroke-linejoin: round; }
  .p1 .coroa { display: inline; fill: #ffd700; stroke: #02200e; }
  .p2 .coroa { display: inline; fill: #d8eee2; }
  .p3 .coroa { display: inline; fill: #e5a260; }

  .nome {
    flex: 1;
    min-width: 0;
    font-size: 3.3vh;
    font-weight: 600;
    color: var(--texto-claro);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.01em;
  }
  .medalha { font-size: 3.6vh; }

  .subiu { z-index: 5; animation: pulsoNeon 1.2s ease-in-out 2; }
  @keyframes pulsoNeon {
    0%, 100% { box-shadow: 0 0.6vh 1.8vh rgba(0, 0, 0, 0.18), 0 0 0 0 rgba(180, 246, 31, 0); }
    50% { box-shadow: 0 0.6vh 1.8vh rgba(0, 0, 0, 0.18), 0 0 0 0.8vh rgba(180, 246, 31, 0.45); }
  }
  .tag {
    position: absolute;
    top: -1.3vh;
    right: 4.5vw;
    padding: 0.25vh 1.2vw;
    border-radius: 99px;
    background: var(--verde-canva);
    color: var(--verde-profundo);
    font-family: 'Syne', sans-serif;
    font-size: 2.1vh;
    font-weight: 800;
    box-shadow: 0 0.4vh 1.2vh rgba(0, 0, 0, 0.3);
    animation: surgir 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes surgir { from { transform: scale(0); } }

  /* Placares vazios lisos, sem borda tracejada (DFE8133) */
  .sombra {
    background: rgba(255, 255, 255, 0.55);
    border: none;
    box-shadow: 0 0.4vh 1vh rgba(1, 45, 17, 0.05);
  }
  .sombra .pos {
    background: rgba(1, 45, 17, 0.08);
    color: rgba(1, 45, 17, 0.35);
    border-color: transparent;
  }
  .sombra .avatar {
    background: rgba(1, 45, 17, 0.08);
    border-color: transparent;
    box-shadow: none;
  }
  .sombra .nome {
    height: 2.2vh;
    max-width: 45%;
    border-radius: 99px;
    background: rgba(1, 45, 17, 0.08);
  }

  .confete { position: fixed; z-index: 10; font-size: 3.4vh; pointer-events: none; }
</style>
</head>
<body>
<span class="nuvem" style="top:4vh">☁️</span>
<span class="nuvem" style="top:16vh;animation-delay:-30s">☁️</span>

<header>
  <div class="evento-wrapper">
    <div class="badge-tag">#</div>
    <div class="evento" id="evento"></div>
  </div>
</header>
<main id="grade"></main>

<script>
const PESSOA = `<svg viewBox="6 3 36 36">
  <path class="corpo" d="M9 49c0-9.5 6.7-16 15-16s15 6.5 15 16z"/>
  <ellipse cx="18" cy="39" rx="3.6" ry="2.2" fill="#fff" opacity=".3"/>
  <circle class="cabeca" cx="24" cy="22.5" r="9.5"/>
  <ellipse cx="20.5" cy="18.5" rx="2.6" ry="1.6" fill="#fff" opacity=".55"/>
  <circle class="olho" cx="20.7" cy="22" r="1.4"/><circle class="olho" cx="27.3" cy="22" r="1.4"/>
  <circle cx="18.6" cy="25.6" r="1.7" fill="#f2a1a1" opacity=".7"/><circle cx="29.4" cy="25.6" r="1.7" fill="#f2a1a1" opacity=".7"/>
  <path class="boca" d="M21 26q3 2.6 6 0"/>
  <path class="coroa" d="M16.5 13.5l1.2-7.5 3.6 4.2L24 4.5l2.7 5.7 3.6-4.2 1.2 7.5z"/>
</svg>`;

const CORES = [
  ['#b4f61f', '#e6fbb2', '#0c3519'],
  ['#8b572a', '#f3d9b8', '#082a14'],
  ['#2e6b3f', '#cce6d3', '#05200e'],
  ['#f59e0b', '#fed7aa', '#0a2e16'],
  ['#10b981', '#a7f3d0', '#062612'],
  ['#7aa84f', '#d3e8bd', '#072613'],
  ['#b5ea18', '#f0fcd4', '#0d381c'],
  ['#d49a6a', '#fae5d3', '#072411']
];
const MEDALHAS = ['🥇','🥈','🥉'];

const grade = document.getElementById('grade');
const cards = new Map();
const posicao = new Map();
let assinatura = '', eventoAtual = null;

function criarCard(p) {
  const el = document.createElement('div');
  el.className = 'card';
  const [c, c2, bg] = CORES[p.av % CORES.length];
  el.innerHTML = `<div class="pos"></div>
    <div class="avatar" style="--c:${c};--c2:${c2};--bg:${bg}">${PESSOA}</div>
    <div class="nome"></div><span class="medalha"></span>`;
  el.querySelector('.nome').textContent = p.nome;
  return el;
}

function confete(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('span');
    c.className = 'confete';
    c.textContent = ['⚡','⭐','🟢','✨','🎉','🔥'][i % 6];
    c.style.left = r.left + r.width / 2 + 'px';
    c.style.top = r.top + r.height / 2 + 'px';
    document.body.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 110;
    c.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) scale(1.3) rotate(${ang * 120}deg)`, opacity: 0 }
    ], { duration: 1300, easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => c.remove();
  }
}

function desenhar(dados) {
  if (dados.evento !== eventoAtual) {
    eventoAtual = dados.evento;
    document.getElementById('evento').textContent = dados.evento;
    grade.innerHTML = ''; cards.clear(); posicao.clear();
  }
  grade.querySelectorAll('.sombra').forEach(s => s.remove());

  const antes = new Map([...cards].map(([id, el]) => [id, el.getBoundingClientRect()]));
  const ids = new Set(dados.top.map(p => p.id));
  for (const [id, el] of cards) if (!ids.has(id)) { el.remove(); cards.delete(id); posicao.delete(id); }

  dados.top.forEach((p, i) => {
    let el = cards.get(p.id);
    if (!el) { el = criarCard(p); cards.set(p.id, el); }
    el.classList.remove('p1', 'p2', 'p3');
    if (i < 3) el.classList.add('p' + (i + 1));
    el.querySelector('.pos').textContent = i + 1;
    el.querySelector('.medalha').textContent = MEDALHAS[i] || '';
    grade.appendChild(el);
  });
  for (let i = dados.top.length; i < 10; i++) {
    grade.insertAdjacentHTML('beforeend', `<div class="card sombra"><div class="pos">${i + 1}</div><div class="avatar"></div><div class="nome"></div></div>`);
  }

  dados.top.forEach((p, i) => {
    const el = cards.get(p.id), r0 = antes.get(p.id), antigo = posicao.get(p.id);
    posicao.set(p.id, i);
    if (!r0) {
      el.animate([{ transform: 'scale(.85)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 500, easing: 'ease-out' });
      return;
    }
    const r1 = el.getBoundingClientRect(), dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (dx || dy) {
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }],
                 { duration: 900, easing: 'cubic-bezier(.3,.9,.3,1)' });
    }
    if (antigo !== undefined && i < antigo) {
      el.classList.remove('subiu'); void el.offsetWidth; el.classList.add('subiu');
      el.querySelector('.tag')?.remove();
      el.insertAdjacentHTML('beforeend', `<span class="tag">⬆ subiu ${antigo - i}!</span>`);
      setTimeout(() => confete(el), 800);
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.classList.remove('subiu'); el.querySelector('.tag')?.remove(); }, 6000);
    }
  });
}

async function atualizar() {
  try {
    const dados = await (await fetch('/api/ranking', { cache: 'no-store' })).json();
    const s = JSON.stringify(dados);
    if (s !== assinatura) { assinatura = s; desenhar(dados); }
  } catch { }
}
atualizar();
setInterval(atualizar, 1500);
</script>
</body>
</html>
